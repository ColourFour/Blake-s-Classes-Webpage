<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 1 Reward Game - Number Pop</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="script.js"></script>
</head>
<body data-lang="zh" class="challenge-body" style="--week-color:#2f8f83;--week-accent:#f4c64d">
  <header class="site-bar no-print">
    <a class="home-link" href="index.html"><span class="lang zh">数学冒险地图</span><span class="lang en">Math Adventure Map</span></a>
    <button class="lang-toggle" type="button" data-lang-toggle><span class="lang zh">English</span><span class="lang en">中文</span></button>
  </header>
  <main class="challenge-shell reward-game-page" data-reward-game-app>
    <section class="challenge-start" data-game-locked>
      <p class="eyebrow">🏝️ <span class="lang zh">宝藏小岛</span><span class="lang en">Treasure Island</span></p>
      <h1><span class="lang zh">奖励游戏还锁着</span><span class="lang en">Reward Game Locked</span></h1>
      <p><span class="lang zh">完成本周挑战后，这个小游戏就会打开。</span><span class="lang en">Complete this week's challenge to unlock this game.</span></p>
      <a class="challenge-primary" href="week-01-challenge.html"><span class="lang zh">去挑战</span><span class="lang en">Go to Challenge</span></a>
    </section>
    <section class="challenge-start is-hidden" data-game-ready>
      <p class="eyebrow">🏝️ <span class="lang zh">宝藏小岛</span><span class="lang en">Treasure Island</span></p>
      <h1><span class="lang zh">数字泡泡</span><span class="lang en">Number Pop</span></h1>
      <p><span class="lang zh">点中目标数字泡泡。</span><span class="lang en">Click the target number bubble.</span></p>
      <button class="challenge-primary" type="button" data-reward-start><span class="lang zh">开始玩</span><span class="lang en">Start Playing</span></button>
    </section>
    <section class="challenge-card is-hidden" data-reward-play>
      <div class="challenge-status"><span data-reward-progress></span><span data-reward-score></span></div>
      <p class="challenge-prompt" data-reward-prompt></p>
      <div class="challenge-visual" data-reward-visual></div>
      <div class="reward-choices" data-reward-choices></div>
      <p class="challenge-soft" data-reward-feedback aria-live="polite"><span class="lang zh">选一个答案。</span><span class="lang en">Choose one answer.</span></p>
    </section>
    <section class="challenge-results is-hidden" data-reward-results></section>
  </main>
  <script type="application/json" id="rewardGameData">{"week":1,"titleZh":"数字泡泡","titleEn":"Number Pop","instructionZh":"点中目标数字泡泡。","instructionEn":"Click the target number bubble.","themeZh":"宝藏小岛","themeEn":"Treasure Island","icon":"🏝️","rounds":[{"promptZh":"点 5。","promptEn":"Tap 5.","visual":"<div class=\"number-path\"><span>3</span><span>5</span><span>8</span></div>","choices":[{"zh":"3","en":"3","value":"3"},{"zh":"5","en":"5","value":"5"},{"zh":"8","en":"8","value":"8"}],"answer":"5"},{"promptZh":"有几颗星？","promptEn":"How many stars?","visual":"<div class=\"dot-row\"><span class=\"dot\">⭐</span><span class=\"dot\">⭐</span><span class=\"dot\">⭐</span><span class=\"dot\">⭐</span><span class=\"dot\">⭐</span><span class=\"dot\">⭐</span><span class=\"dot\">⭐</span></div>","choices":[{"zh":"6","en":"6","value":"6"},{"zh":"7","en":"7","value":"7"},{"zh":"9","en":"9","value":"9"}],"answer":"7"},{"promptZh":"点更大的数。","promptEn":"Tap the bigger number.","visual":"<div class=\"equation\"><span>4</span><span>?</span><span>9</span></div>","choices":[{"zh":"4","en":"4","value":"4"},{"zh":"9","en":"9","value":"9"}],"answer":"9"},{"promptZh":"少了几？","promptEn":"What is missing?","visual":"<div class=\"number-path\"><span>6</span><span>7</span><span>?</span><span>9</span></div>","choices":[{"zh":"7","en":"7","value":"7"},{"zh":"8","en":"8","value":"8"},{"zh":"9","en":"9","value":"9"}],"answer":"8"},{"promptZh":"点 10。","promptEn":"Tap 10.","visual":"<div class=\"number-path\"><span>10</span><span>6</span><span>8</span></div>","choices":[{"zh":"10","en":"10","value":"10"},{"zh":"6","en":"6","value":"6"},{"zh":"8","en":"8","value":"8"}],"answer":"10"},{"promptZh":"哪边更多？","promptEn":"Which side has more?","visual":"<div class=\"compare-bars\"><div><b>A</b><span style=\"--w:5\">5</span></div><div><b>B</b><span style=\"--w:8\">8</span></div></div>","choices":[{"zh":"A","en":"A","value":"A"},{"zh":"B","en":"B","value":"B"}],"answer":"B"}]}</script>
</body>
</html>
