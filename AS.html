<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS Holiday Homework Submission</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header / Hero section -->
    <section class="hero">
        <h1>AS Mathematics</h1>
        <p>Holiday Homework Submission</p>
    </section>

    <!-- Submission form section -->
    <div class="form-section">
        <h2>Download &amp; Submit Your Homework Scores</h2>
        <p><a href="Files/AS Holiday Homework 2026.pdf" target="_blank" style="color: hotpink;">Download AS Holiday Homework (PDF)</a></p>
        <form id="scoreForm" action="https://formspree.io/f/xbdggggy" method="POST">
            <!-- Student name input -->
            <div class="form-group">
                <label for="studentName">Your Name (English only)</label>
                <input type="text" id="studentName" name="studentName"
                       pattern="[A-Za-z ]+" required placeholder="Enter your English name">
            </div>

            <!-- Paper dropdown -->
            <div class="form-group">
                <label for="paperSelect">Select Paper</label>
                <select id="paperSelect" name="paper" required>
                    <option value="">-- Select Paper --</option>
                    <option value="1">Paper 1 11/O/N/23</option>
                    <option value="2">Paper 2 12/M/J/21</option>
                    <option value="3">Paper 3 42/F/M/20</option>
                    <option value="4">Paper 4 12/O/N/19</option>
                    <option value="5">Paper 5 12/O/N/22</option>
                    <option value="6">Paper 6 42/M/J/19</option>
                    <option value="7">Paper 7 (redo)</option>
                </select>
            </div>

            <!-- Work PDF (required, NOT uploaded) -->
            <div class="form-group">
                <label for="workPdf">Work PDF (required, max 10MB)</label>
                <input type="file" id="workPdf" accept="application/pdf" required>
                <small style="opacity:.8;">Ensure this is a pdf and the size is smaller than 10mb. If you need help, send me a message!</small>

            </div>

            <!-- Container for dynamic question inputs -->
            <div id="questionsContainer"></div>

            <!-- Hidden fields for email body and metadata -->
            <input type="hidden" name="_subject" value="Holiday Homework Scores">
            <input type="hidden" id="emailMessage" name="message">
            <input type="hidden" id="submissionDate" name="submissionDate">

            <!-- Submit button -->
            <button type="submit" class="submit-btn">Submit Scores</button>
        </form>
    </div>

    <!-- Confirmation message (hidden until submission) -->
    <div class="confirmation" id="confirmationMessage">
        <p>Thank you for submitting your scores. We have received your submission.</p>
    </div>

    <!-- Inline script to handle dynamic question fields and form submission -->
    <script>
    (function() {
        const paperSelect = document.getElementById('paperSelect');
        const questionsContainer = document.getElementById('questionsContainer');
        const form = document.getElementById('scoreForm');

        const workPdf = document.getElementById('workPdf');
        const MAX_FILE_MB = 10;
        const MAX_FILE_BYTES = MAX_FILE_MB * 1024 * 1024;

        workPdf.addEventListener('change', () => {
            const file = workPdf.files && workPdf.files[0];
            if (!file) return;

            const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
            if (!isPdf) {
                alert('Please choose a PDF file.');
                workPdf.value = '';
                return;
            }

            if (file.size > MAX_FILE_BYTES) {
                alert(`PDF too large. Please keep it under ${MAX_FILE_MB}MB.`);
                workPdf.value = '';
                return;
            }
        });

        // Configuration for each paper: maximum points per question.
        // Update these arrays to match the actual number of questions and max points for each paper.
        const papers = {
            '1': { maxPoints: [4, 4, 3, 6, 6, 7, 7, 9, 9, 11, 9] },
            '2': { maxPoints: [4, 5, 4, 5, 6, 4, 5, 8, 6, 7, 10, 11] },
            '3': { maxPoints: [4, 6, 6, 7, 8, 9, 10] },
            '4': { maxPoints: [4, 4, 4, 7, 7, 7, 9, 12, 12] },
            '5': { maxPoints: [6, 5, 5, 4, 5, 9, 7, 7, 8, 8, 11] },
            '6': { maxPoints: [6, 6, 5, 7, 8, 7, 11] },
            '7': { maxPoints: [10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10] }
        };

        /**
         * Render input fields for questions based on the selected paper.
         */
        function renderQuestions() {
            const selected = paperSelect.value;
            // Clear existing fields
            questionsContainer.innerHTML = '';
            if (!selected) return;

            // Determine configuration for this paper; default to five questions with max points of 5.
            const config = papers[selected] || { maxPoints: [5, 5, 5, 5, 5] };
            const numQuestions = config.maxPoints.length;
            // Store the current paper's max points globally so we can reference it on submit
            window.currentMaxPoints = config.maxPoints;

            for (let i = 1; i <= numQuestions; i++) {
                const maxPts = config.maxPoints[i - 1];
                const group = document.createElement('div');
                group.className = 'form-group';

                const label = document.createElement('label');
                label.textContent = `Question ${i} Score (0–${maxPts})`;

                const input = document.createElement('input');
                input.type = 'number';
                input.name = `q${i}`;
                input.className = 'questionField';
                input.min = '0';
                input.max = maxPts.toString();
                input.step = '1';
                input.required = true;
                input.placeholder = `0–${maxPts}`;

                // Clamp values to the allowed range as the student types
                input.addEventListener('input', () => {
                    if (input.value === '') return;
                    const v = Number(input.value);
                    const maxV = Number(maxPts);
                    if (Number.isNaN(v)) {
                        input.value = '';
                        return;
                    }
                    if (v < 0) input.value = '0';
                    if (v > maxV) input.value = String(maxV);
                });

                group.appendChild(label);
                group.appendChild(input);
                questionsContainer.appendChild(group);
            }
        }

        // Re-render question fields when the user changes the paper selection
        paperSelect.addEventListener('change', renderQuestions);
        renderQuestions(); // Initial render with empty container

        /**
         * Before submitting the form, compile the data into a single message string
         * and insert it into the hidden 'emailMessage' input. The submission date
         * is also captured in ISO format. A confirmation prompt appears before sending.
         */
        form.addEventListener('submit', function(event) {
            const file = workPdf.files && workPdf.files[0];
            if (!file) {
                alert('Please attach your work PDF before submitting.');
                event.preventDefault();
                return;
            }
            const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
            if (!isPdf) {
                alert('Please choose a PDF file.');
                workPdf.value = '';
                event.preventDefault();
                return;
            }
            if (file.size > MAX_FILE_BYTES) {
                alert(`PDF too large. Please keep it under ${MAX_FILE_MB}MB.`);
                workPdf.value = '';
                event.preventDefault();
                return;
            }

            // Ensure all required fields (including question scores) are filled in
            if (!form.checkValidity()) {
                event.preventDefault();
                form.reportValidity();
                return;
            }

            const name = document.getElementById('studentName').value.trim();
            const paper = paperSelect.value;

            if (!paper) {
                alert('Please select a paper.');
                event.preventDefault();
                return;
            }

            // Build a TSV (tab-separated) body so you can paste directly into Excel.
            // Row 1: header (PaperX, q1, q2, ...)
            // Row 2: student scores (Name, score1, score2, ...)
            const inputs = document.querySelectorAll('.questionField');
            const scores = Array.from(inputs).map((input) => (input.value.trim() === '' ? '0' : input.value.trim()));

            const header = [`Paper${paper}`, ...scores.map((_, i) => `q${i + 1}`)].join('\t');
            const row = [name, ...scores].join('\t');

            const body = `${header}\n${row}`;

            document.getElementById('emailMessage').value = body;
            document.getElementById('submissionDate').value = new Date().toISOString();

            // Ask for final confirmation
            if (!confirm('Submit your scores now?')) {
                event.preventDefault();
                return;
            }

            // After successful submission, show confirmation message
            form.style.display = 'none';
            document.getElementById('confirmationMessage').style.display = 'block';
        });
    })();
    </script>
</body>
</html>
